<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test 3D budov</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --panel: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --border: #e4e4e7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color: var(--text); background: #f4f4f5; }
    #map { position: absolute; inset: 0; }

    .panel {
      position: absolute; top: 16px; left: 16px; width: min(320px, calc(100% - 32px));
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.08);
    }
    .panel h1 { font-size: 15px; margin: 0 0 4px; }
    .panel p { font-size: 13px; margin: 0; color: var(--muted); line-height: 1.45; }
    .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: none; }
    .detail.visible { display: block; }
    .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 13px; }
    .detail dt { color: var(--muted); }
    .detail dd { margin: 0; font-variant-numeric: tabular-nums; }
    button {
      font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: #fff; color: var(--text);
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h1>Test 3D budov – Hradec Králové</h1>
    <p>Klikněte na budovu: mapa na ni přiblíží, nakloní se a budovu zvýrazní. Esc nebo „Zpět“ vrátí výchozí pohled.</p>

    <div class="detail" id="detail">
      <dl>
        <dt>Výška</dt><dd id="d-vyska">–</dd>
        <dt>Spodní hrana</dt><dd id="d-base">–</dd>
        <dt>Odhad podlaží</dt><dd id="d-podlazi">–</dd>
        <dt>Souřadnice</dt><dd id="d-gps">–</dd>
      </dl>
      <button id="zpet">Zpět na přehled</button>
    </div>
  </div>

  <script>
    const VYCHOZI_POHLED = { center: [15.8328, 50.2092], zoom: 15.5, pitch: 45, bearing: 0 };
    const VYSKA_PODLAZI_M = 3;

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/positron",
      ...VYCHOZI_POHLED,
      maxPitch: 75,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
    // Kontejner může mít při inicializaci nulovou velikost (skrytý panel, iframe)
    new ResizeObserver(() => map.resize()).observe(document.getElementById("map"));

    map.on("load", () => {
      // Plochý 2D obrys budov ze stylu nahradíme 3D vrstvou
      if (map.getLayer("building")) map.setLayoutProperty("building", "visibility", "none");

      map.addLayer({
        id: "budovy-3d",
        type: "fill-extrusion",
        source: "openmaptiles",
        "source-layer": "building",
        minzoom: 13,
        filter: ["!=", ["get", "hide_3d"], true],
        paint: {
          "fill-extrusion-color": "#d4d4d8",
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], 6],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-opacity": 0.85,
        },
      });

      // Vybraná budova: kopie geometrie v samostatném zdroji, nezávisí na ID prvků v dlaždicích
      map.addSource("vybrana", { type: "geojson", data: prazdnaKolekce() });
      map.addLayer({
        id: "vybrana-3d",
        type: "fill-extrusion",
        source: "vybrana",
        paint: {
          "fill-extrusion-color": "#2563eb",
          "fill-extrusion-height": ["+", ["coalesce", ["get", "render_height"], 6], 0.3],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-opacity": 0.95,
        },
      });
    });

    map.on("click", "budovy-3d", (e) => {
      const budova = e.features[0];
      if (!budova) return;

      map.getSource("vybrana").setData({
        type: "FeatureCollection",
        features: [{ type: "Feature", geometry: budova.geometry, properties: budova.properties }],
      });

      const stred = stredGeometrie(budova.geometry);
      map.flyTo({ center: stred, zoom: 18, pitch: 60, bearing: map.getBearing() - 30, duration: 1600, essential: true });
      zobrazDetail(budova.properties, stred);
    });

    map.on("mouseenter", "budovy-3d", () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", "budovy-3d", () => (map.getCanvas().style.cursor = ""));

    document.getElementById("zpet").addEventListener("click", zpetNaPrehled);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") zpetNaPrehled(); });

    function zpetNaPrehled() {
      map.getSource("vybrana")?.setData(prazdnaKolekce());
      document.getElementById("detail").classList.remove("visible");
      map.flyTo({ ...VYCHOZI_POHLED, duration: 1200 });
    }

    function zobrazDetail(vlastnosti, [lng, lat]) {
      const vyska = vlastnosti.render_height;
      const base = vlastnosti.render_min_height ?? 0;
      document.getElementById("d-vyska").textContent = vyska != null ? `${vyska} m` : "neuvedeno";
      document.getElementById("d-base").textContent = `${base} m`;
      document.getElementById("d-podlazi").textContent =
        vyska != null ? `≈ ${Math.max(1, Math.round((vyska - base) / VYSKA_PODLAZI_M))}` : "–";
      document.getElementById("d-gps").textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById("detail").classList.add("visible");
    }

    // Střed obálky geometrie – stačí pro zaměření kamery
    function stredGeometrie(geometrie) {
      const body = geometrie.coordinates.flat(Infinity);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < body.length; i += 2) {
        minX = Math.min(minX, body[i]); maxX = Math.max(maxX, body[i]);
        minY = Math.min(minY, body[i + 1]); maxY = Math.max(maxY, body[i + 1]);
      }
      return [(minX + maxX) / 2, (minY + maxY) / 2];
    }

    function prazdnaKolekce() {
      return { type: "FeatureCollection", features: [] };
    }
  </script>
</body>
</html>
