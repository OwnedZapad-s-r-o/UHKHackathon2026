<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraj bez bariér — přístupnost v Královéhradeckém kraji</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0F1418;--panel:#171E23;--line:#2B363D;--line2:#212A30;
    --tx:#E0E7EB;--tx2:#A6B3BB;--tx3:#7B8991;
    --acc:#4FA3C7;--ok:#5BAF7A;--warn:#D9944A;--bad:#C9584A;--map:#111719;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);
    font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;overflow:hidden}
  #map{flex:1;height:100%;background:var(--map)}
  .leaflet-container{background:var(--map);font:inherit}
  .leaflet-bar a{background:var(--panel);color:var(--tx);border-color:var(--line)}
  #panel{width:420px;flex:none;height:100%;display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--line)}
  @media(max-width:940px){body{flex-direction:column}#map{height:46%}#panel{width:100%;height:54%;border:0;border-top:1px solid var(--line)}}

  .pad{padding:14px 16px}
  .hr{border-top:1px solid var(--line)}
  h1{font-size:1rem;margin:0;font-weight:600}
  .sub{font-size:.74rem;color:var(--tx3);margin:2px 0 0}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
  .tabs button{flex:1;padding:9px 3px;background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--tx3);font:inherit;font-size:.77rem;cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
  #body{flex:1;overflow-y:auto;min-height:0}

  select,input{width:100%;padding:7px 9px;background:var(--bg);color:var(--tx);
    border:1px solid var(--line);border-radius:5px;font:inherit;font-size:.82rem}
  label.fl{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--tx3);margin:12px 0 5px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;padding:7px 4px;background:transparent;border:0;border-right:1px solid var(--line);
    color:var(--tx2);font:inherit;font-size:.76rem;cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--acc);color:#07131A;font-weight:600}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .kpi{background:var(--panel);padding:10px 13px}
  .kpi b{display:block;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi span{font-size:.68rem;color:var(--tx3);display:block;margin-top:1px;line-height:1.3}
  .kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}

  .t1{font-size:.97rem;font-weight:600;margin:0 0 2px;line-height:1.3}
  .t2{font-size:.73rem;color:var(--tx3);margin:0 0 10px}
  table.rows{width:100%;border-collapse:collapse;font-size:.81rem}
  .rows td{padding:5px 0;border-bottom:1px solid var(--line2);vertical-align:top}
  .rows tr:last-child td{border-bottom:0}
  .rows .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;width:58px;white-space:nowrap}
  .rows .sm{font-size:.71rem;color:var(--tx3);display:block}
  .stack{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:4px;background:var(--line)}
  .stack i{display:block;height:100%}
  .note{font-size:.74rem;color:var(--tx3);line-height:1.5}
  .warnbox{border-left:2px solid var(--warn);padding:8px 11px;font-size:.76rem;color:var(--tx2);
    background:#3A2A1955;margin:10px 0}
  .okbox{border-left:2px solid var(--acc);padding:8px 11px;font-size:.78rem;color:var(--tx2);
    background:#16323D55;margin:10px 0}
  code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:#16323D;padding:1px 4px;border-radius:3px}
  .empty{color:var(--tx3);font-size:.82rem;font-style:italic}
  a{color:var(--acc)}
  .chips2{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chips2 span{font-size:.68rem;padding:2px 7px;border-radius:10px;background:#16323D;color:var(--acc)}
  .chips2 span.no{background:#3A211E;color:var(--bad)}
  .legend{display:flex;flex-direction:column;gap:4px;margin-top:9px;font-size:.71rem;color:var(--tx2)}
  .legend div{display:flex;align-items:center;gap:7px}
  .sw{width:20px;height:9px;border-radius:2px;flex:none}

  #chat{flex:none;border-top:1px solid var(--line);background:#131A1F}
  #log{max-height:180px;overflow-y:auto;padding:10px 14px 4px}
  .msg{margin-bottom:9px;font-size:.82rem;line-height:1.5}
  .msg.u{color:var(--tx3)} .msg.u b{color:var(--tx2)}
  .msg .tool{display:inline-block;font-family:ui-monospace,monospace;font-size:.7rem;
    background:#16323D;color:var(--acc);padding:1px 6px;border-radius:3px;margin-bottom:3px}
  .chatbar{display:flex;gap:7px;padding:9px 12px 11px}
  .chatbar input{flex:1}
  .chatbar button{padding:7px 11px;background:var(--acc);color:#07131A;border:0;border-radius:5px;
    font:inherit;font-weight:600;font-size:.8rem;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 9px}
  .chips button{background:transparent;border:1px solid var(--line);color:var(--tx3);
    border-radius:11px;padding:3px 9px;font:inherit;font-size:.71rem;cursor:pointer}
  .chips button:hover{border-color:var(--acc);color:var(--acc)}

  #load{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:13px}
  #load .track{width:250px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  #load .fill{height:100%;width:0;background:var(--acc);transition:width .3s}
  .leaflet-tooltip{background:var(--panel);border:1px solid var(--line);color:var(--tx);
    box-shadow:none;font-size:.77rem;padding:4px 7px;max-width:280px;white-space:normal}
</style>
</head>
<body>

<div id="load">
  <div id="load-t" style="color:var(--tx2);font-size:.9rem">Načítám otevřená data…</div>
  <div class="track"><div class="fill" id="load-f"></div></div>
</div>

<div id="map"></div>

<aside id="panel">
  <div class="pad" style="flex:none">
    <h1>Kraj bez bariér</h1>
    <p class="sub">Přístupnost v Královéhradeckém kraji · kraj + detail Hradce</p>
  </div>
  <div class="tabs" role="tablist">
    <button id="t-kraj"   role="tab" aria-selected="true">Kraj</button>
    <button id="t-hradec" role="tab" aria-selected="false">Hradec</button>
    <button id="t-ai"     role="tab" aria-selected="false">AI rozbor</button>
    <button id="t-diry"   role="tab" aria-selected="false">Díry v datech</button>
  </div>
  <div id="body"></div>
  <div id="chat">
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <div class="chatbar">
      <input id="q" placeholder="Např. kolik knihoven je bezbariérových?">
      <button id="mic" title="Hlas">🎤</button>
      <button id="send">Zeptat</button>
    </div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   Kraj bez bariér — prototyp nad otevřenými daty
   · kraj: živě z ArcGIS API portálu Data KHK (CORS otevřené)
   · Hradec: 10 vrstev „Bezbariérový Hradec" (CC0), předem převedených
     z S-JTSK Křovák do WGS84 skriptem Analyza/hk/prevod.py — ckan.mmhk.cz
     neposílá CORS hlavičky, takže shapefile nejde načíst přímo z prohlížeče
   ══════════════════════════════════════════════════════════════════════════ */

const SVC='https://services6.arcgis.com/ogJAiK65nXL1mXAW/arcgis/rest/services';
const KRAJ=[
 {klic:'knihovny', nazev:'Knihovny', api:SVC+'/Knihovny/FeatureServer/0',
  pole:'nazev,bezbarierovost,nazev_obce,kod_obce,typ_knihovny,x,y', bez:'bezbarierovost', pozn:null},
 {klic:'muzea', nazev:'Muzea a galerie', api:SVC+'/Muzea_a_galerie/FeatureServer/0',
  pole:'nazev,bezbarierovost,pozn_bezbarierovost,nazev_obce,kod_obce,x,y', bez:'bezbarierovost', pozn:'pozn_bezbarierovost'},
 {klic:'kd', nazev:'Kulturní domy', api:SVC+'/Kulturn%C3%AD_domy/FeatureServer/0',
  pole:'nazev,bezbarierovost,bezbarierovost_poznamka,nazev_obce,kod_obce,kapacita,x,y', bez:'bezbarierovost', pozn:'bezbarierovost_poznamka'},
 {klic:'kina', nazev:'Kina', api:SVC+'/Kina/FeatureServer/0',
  pole:'nazev,bezbarierovost,pozn_bezbarierovost,nazev_obce,kod_obce,typ_kina,x,y', bez:'bezbarierovost', pozn:'pozn_bezbarierovost'},
 {klic:'kluby', nazev:'Hudební kluby', api:SVC+'/Hudebn%C3%AD_kluby_a_festival_parky/FeatureServer/0',
  pole:'nazev,bezbari%C3%A9rovost,bezbari%C3%A9rovost_pozn,nazev_obce,kod_obce,x,y', bez:'bezbariérovost', pozn:'bezbariérovost_pozn'},
 {klic:'divadla', nazev:'Divadla a filharmonie', api:SVC+'/Divadla_a_filharmonie/FeatureServer/0',
  pole:'nazev,bezbarierovost,typ_bezbarierovosti,nazev_obce,kod_obce,kapacita,x,y', bez:'bezbarierovost', pozn:'typ_bezbarierovosti'},
 {klic:'zus', nazev:'ZUŠ', api:SVC+'/Z%C3%A1kladn%C3%AD_um%C4%9Bleck%C3%A9_%C5%A1koly/FeatureServer/0',
  pole:'nazev,bezbarierovost,pozn_bezbarierovost,nazev_obce,kod_obce,x,y', bez:'bezbarierovost', pozn:'pozn_bezbarierovost'}
];
const HRADEC=[
 ['objekty_vozicky','Objekty – vozíčky','vozik'],['objekty_nevidomi','Objekty – nevidomí','zrak'],
 ['prechody_vozicky','Přechody – vozíčky','vozik'],['prechody_nevidomi','Přechody – nevidomí','zrak'],
 ['zastavky_vozicky','Zastávky – vozíčky','vozik'],['zastavky_nevidomi','Zastávky – nevidomí','zrak'],
 ['chodniky_nevidomi','Chodníky – nevidomí','zrak'],['useky_nevidomi','Úseky – nevidomí','zrak'],
 ['indukcni_smycky','Indukční smyčky','sluch'],['trasy','Bezbariérové trasy','vozik']];
const ODKAZ_KRAJ='https://www.datakhk.cz/search?q=bezbari%C3%A9rovost';
const ODKAZ_HK='https://ckan.mmhk.cz/dataset/bezbarierovy-hradec';

const nf=new Intl.NumberFormat('cs-CZ');
const $=id=>document.getElementById(id);
const norm=s=>(s||'').toString().trim().toLowerCase();
/** sjednocení hodnot: ANO/ano, ČÁSTEČNĚ/částečně, NE/ne, NEZJIŠTĚNO, prázdné */
function stav(v){
  const s=norm(v);
  if(!s) return 'nevime';
  if(s.startsWith('ano')) return 'ano';
  if(s.startsWith('č')||s.startsWith('c')) return 'castecne';
  if(s.startsWith('ne')&&!s.startsWith('nezj')) return 'ne';
  return 'nevime';
}
const BARVA={ano:'#5BAF7A',castecne:'#D9944A',ne:'#C9584A',nevime:'#5A6870'};
const POPIS={ano:'bezbariérové',castecne:'částečně',ne:'nepřístupné',nevime:'nevíme'};

async function jget(u){const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); if(j.error) throw new Error(j.error.message); return j;}
async function page(api,fields){
  const out=[];
  for(let off=0;;off+=2000){
    const j=await jget(`${api}/query?where=1%3D1&outFields=${fields}&returnGeometry=false&resultRecordCount=2000&resultOffset=${off}&f=json`);
    const f=j.features||[]; out.push(...f.map(x=>x.attributes));
    if(f.length<2000) break;
  }
  return out;
}

let D={mista:[],hk:{},obce:null}, map, obceLayer, mistaLayer, hkLayer;
let tab='kraj', hendikep='vse', vrstvaHK='objekty_vozicky', vybranaObec=null;

const KROKY=['hranice obcí','kulturní místa kraje','vrstvy Bezbariérového Hradce','počítám'];
let krok=0;
const tick=t=>{$('load-t').textContent='Načítám '+(t||KROKY[krok]||'…')+'…';
  $('load-f').style.width=Math.round(++krok/6*100)+'%';};

(async function(){
 try{
  tick('hranice obcí');
  const hran=await jget(`${SVC}/Hranice_obc%C3%AD_v_Kr%C3%A1lov%C3%A9hradeck%C3%A9m_kraji/FeatureServer/0/query`+
    `?where=1%3D1&outFields=nazev_obce,kod_obce&maxAllowableOffset=0.0008&f=geojson&resultRecordCount=1000`);
  for(const s of KRAJ){
    tick(s.nazev);
    const rows=await page(s.api,s.pole);
    for(const r of rows) D.mista.push({
      sada:s.nazev, klic:s.klic, nazev:r.nazev,
      obec:r.nazev_obce, kod_obce:r.kod_obce,
      x:+r.x, y:+r.y,
      stav:stav(r[s.bez]),
      pozn:s.pozn? (r[s.pozn]||'').trim() : ''
    });
  }
  tick('vrstvy Hradce');
  for(const [klic,nazev] of HRADEC){
    try{ D.hk[klic]=await (await fetch('data/'+klic+'.geojson')).json(); }
    catch(e){ D.hk[klic]={type:'FeatureCollection',features:[]}; }
  }
  D.obce=hran;
  spocti(); initMap(); setTab('kraj'); renderChips();
  say('a','Ptej se nad daty. Volám <b>funkce nad reálnými čísly</b> — nic si nedomýšlím.');
  $('load').remove();
 }catch(e){
  $('load').innerHTML=`<div class="pad" style="max-width:540px"><h1>Data se nepodařilo načíst</h1>
   <p class="note">${e.message}</p>
   <p class="note">Spusť přes <code>python -m http.server 8080</code>, ne přes <code>file://</code>.
   Vrstvy Hradce musí být v <code>Prototyp/data/</code> — vyrobí je <code>python Analyza/hk/prevod.py</code>.</p></div>`;
 }
})();

function spocti(){
  const podleObce=new Map();
  for(const m of D.mista){
    if(!m.kod_obce) continue;
    const o=podleObce.get(m.kod_obce)||{ano:0,castecne:0,ne:0,nevime:0,celkem:0,nazev:m.obec};
    o[m.stav]++; o.celkem++; podleObce.set(m.kod_obce,o);
  }
  D.podleObce=podleObce;
  D.souhrn=D.mista.reduce((a,m)=>{a[m.stav]++;a.celkem++;return a;},{ano:0,castecne:0,ne:0,nevime:0,celkem:0});
  D.hkPocty=Object.fromEntries(HRADEC.map(([k])=>[k,(D.hk[k]?.features||[]).length]));
  D.hkCelkem=Object.values(D.hkPocty).reduce((a,b)=>a+b,0);
  D.poznamky=D.mista.filter(m=>m.pozn).map(m=>({kde:m.nazev,obec:m.obec,sada:m.sada,text:m.pozn,zdroj:'kraj'}));
  for(const [k,nazev] of HRADEC)
    for(const f of (D.hk[k]?.features||[])){
      const p=f.properties||{};
      for(const pole of ['POZNAMKA','POZNAMKA1','POZN','POZN1','POZN2','PROBLEM'])
        if(p[pole]) D.poznamky.push({kde:p.INSTITUCE||p.ZASTAVKA||p.ULICE||p.NAZEV||nazev,
          obec:'Hradec Králové',sada:nazev,text:p[pole],zdroj:'hradec'});
    }
}

/* ───────────────────── MAPA ───────────────────── */
function initMap(){
  map=L.map('map',{attributionControl:false,minZoom:7}).setView([50.3,15.85],9);
  obceLayer=L.geoJSON(D.obce,{style:f=>stylObec(f.properties.kod_obce),onEachFeature:(f,l)=>{
    const k=f.properties.kod_obce;
    l.bindTooltip(()=>tipObec(k),{sticky:true});
    l.on('click',()=>{vybranaObec=(vybranaObec===k?null:k); render(); repaint();});
  }}).addTo(map);
  mistaLayer=L.layerGroup().addTo(map);
  hkLayer=L.layerGroup();
  kresliMista();
  let moved=false,fitting=false;
  const fit=()=>{fitting=true;map.invalidateSize({animate:false});
    if(!moved){const b=obceLayer.getBounds(); if(b.isValid()) map.fitBounds(b,{padding:[10,10],animate:false});}
    fitting=false;};
  fit(); requestAnimationFrame(fit); setTimeout(fit,250);
  map.on('zoomstart dragstart',()=>{if(!fitting)moved=true;});
  if(window.ResizeObserver){let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(fit,120)}).observe($('map'));}
  addEventListener('resize',fit);
}
function podilObce(kod){
  const o=D.podleObce.get(kod); if(!o||!o.celkem) return null;
  const zname=o.ano+o.castecne+o.ne;
  return zname? (o.ano+0.5*o.castecne)/zname : null;
}
function stylObec(kod){
  const p=podilObce(kod), sel=vybranaObec===kod;
  const f=p==null?'#1A2126':(p>=.8?'#3E7F5E':p>=.55?'#6E8A4E':p>=.3?'#B08344':'#A34C3E');
  return {fillColor:f,fillOpacity:p==null?.22:.75,
    color:sel?'#E0E7EB':'#0F1418',weight:sel?2.2:.5};
}
const repaint=()=>obceLayer.setStyle(f=>stylObec(f.properties.kod_obce));

function mistaProMapu(){
  let l=D.mista.filter(m=>m.x&&m.y&&!isNaN(m.x));
  if(hendikep==='sluch') l=l.filter(m=>m.klic==='divadla'&&/sluch/i.test(m.pozn));
  return l;
}
function kresliMista(){
  mistaLayer.clearLayers();
  for(const m of mistaProMapu())
    L.circleMarker([m.y,m.x],{radius:4,fillColor:BARVA[m.stav],color:'#0F1418',weight:1,fillOpacity:.9})
      .bindTooltip(`<b>${m.nazev||m.sada}</b><br>${m.sada} · ${m.obec||''}<br>
        <span style="color:${BARVA[m.stav]}">${POPIS[m.stav]}</span>${m.pozn?'<br><i>'+m.pozn.slice(0,110)+'</i>':''}`)
      .addTo(mistaLayer);
}
function kresliHK(){
  hkLayer.clearLayers();
  const fc=D.hk[vrstvaHK]; if(!fc) return;
  L.geoJSON(fc,{
    pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,fillColor:barvaHK(f.properties),
      color:'#0F1418',weight:1,fillOpacity:.9}),
    style:f=>({color:barvaHK(f.properties),weight:3,opacity:.8}),
    onEachFeature:(f,l)=>l.bindTooltip(tipHK(f.properties))
  }).addTo(hkLayer);
}
function barvaHK(p){
  const h=+p.HODNOCENI;
  if(h===1) return '#5BAF7A'; if(h===2) return '#D9944A'; if(h===3) return '#C9584A';
  return '#4FA3C7';
}
function tipHK(p){
  const nm=p.INSTITUCE||p.ZASTAVKA||p.NAZEV||p.ULICE||p.USEK||p._vrstva;
  const det=[];
  if(p.VSTUP!=null) det.push('vstup '+p.VSTUP);
  if(p.SCHODY==='1') det.push('schody');
  if(p.WC_BEZBAR==='1') det.push('bezbariérové WC');
  if(p.VNITR_BEZB==='1') det.push('vnitřek OK');
  if(p.MAJACEK==='1') det.push('hlasový majáček');
  if(p.AKUST_SIG==='1') det.push('akustická signalizace');
  if(p.HMATNE_PRV==='1') det.push('hmatné prvky');
  const t=p.POZNAMKA||p.POZN||p.PROBLEM||'';
  return `<b>${nm}</b><br>${p._vrstva}${p.HODNOCENI?' · hodnocení '+p.HODNOCENI:''}`+
    (det.length?'<br>'+det.join(' · '):'')+(t?'<br><i>'+t.slice(0,130)+'</i>':'');
}
function tipObec(kod){
  const o=D.podleObce.get(kod), nm=o?.nazev||(D.obce.features.find(f=>f.properties.kod_obce===kod)?.properties.nazev_obce)||kod;
  if(!o) return `<b>${nm}</b><br><span style="color:#7B8991">žádné sledované místo</span>`;
  return `<b>${nm}</b><br>${o.celkem} míst · ${o.ano} bezbariérových, ${o.ne} ne`+
    (o.nevime?`, ${o.nevime} bez údaje`:'');
}

/* ───────────────────── PANEL ───────────────────── */
['kraj','hradec','ai','diry'].forEach(k=>$('t-'+k).onclick=()=>setTab(k));
function setTab(t){
  tab=t;
  for(const k of ['kraj','hradec','ai','diry']) $('t-'+k).setAttribute('aria-selected',String(k===t));

    map.setView([50.2095,15.8320],14); }
  else { map.removeLayer(hkLayer); map.addLayer(mistaLayer); kresliMista(); }
  render(); repaint();
}

}

const AZURE={endpoint:'',deployment:'',apiKey:'',apiVersion:'2024-10-21'};

function pravidla(t){
  const s=norm(t), o={vstup:[],vytah:null,wc:null,sirka:null,varovani:[],signal:[]};
  if(/rampa|nájezd|najezd/.test(s)) o.vstup.push('rampa');
  if(/schod/.test(s)) o.vstup.push('schod');
  if(/zvonek/.test(s)) o.vstup.push('zvonek');
  if(/automat/.test(s)) o.vstup.push('automatické dveře');
  if(/plošin|plosin/.test(s)) o.vstup.push('plošina');
  if(/výtah|vytah/.test(s)) o.vytah=true;
  if(/wc|toalet/.test(s)) o.wc=!/bez wc|není.{0,12}wc|nemá.{0,12}wc/.test(s);
  const m=s.match(/(\d{2,3})\s*cm/); if(m) o.sirka=+m[1];
  if(/nedoporuč|nedoporuc|absence|chybí|chybi|nevhodn/.test(s)) o.varovani.push('bariéra uvedena');
  if(/akustick/.test(s)) o.signal.push('akustická');
  if(/braill/.test(s)) o.signal.push('Braille');
  if(/majáč|majac/.test(s)) o.signal.push('majáček');
  return o;
}
function rozborPoznamek(){
  const zdroj=D.poznamky;
  const out=zdroj.map(p=>({...p,stru:pravidla(p.text)}));
  rozbor={
    n:out.length,
    znaky:zdroj.reduce((a,p)=>a+p.text.length,0),
    rampa:out.filter(x=>x.stru.vstup.includes('rampa')).length,
    schod:out.filter(x=>x.stru.vstup.includes('schod')).length,
    vytah:out.filter(x=>x.stru.vytah).length,
    wc:out.filter(x=>x.stru.wc===true).length,
    sirky:out.filter(x=>x.stru.sirka).length,
    varovani:out.filter(x=>x.stru.varovani.length).length,
    ukazky:out.filter(x=>x.stru.vstup.length||x.stru.sirka).slice(0,6)
  };
  render();
}

/* ───────────────────── CHAT ───────────────────── */
const FUNKCE={
  souhrn_kraje(){ setTab('kraj');
    return {mist:D.souhrn.celkem,bezbarierovych:D.souhrn.ano,castecne:D.souhrn.castecne,
      neprístupnych:D.souhrn.ne,bez_udaje:D.souhrn.nevime,sad:KRAJ.length}; },
  sada({sada}){
    const s=KRAJ.find(x=>norm(x.nazev).includes(norm(sada)))||KRAJ.find(x=>norm(sada).includes(norm(x.nazev)));
    if(!s) return {chyba:`sadu „${sada}" neznám`};
    setTab('kraj');
    const m=D.mista.filter(x=>x.klic===s.klic);
    const c=m.reduce((a,x)=>{a[x.stav]++;return a;},{ano:0,castecne:0,ne:0,nevime:0});
    return {sada:s.nazev,celkem:m.length,...c};
  },
  obec({obec}){
    const q=norm(obec);
    const kod=[...D.podleObce].find(([k,o])=>norm(o.nazev)===q)?.[0]
           || [...D.podleObce].find(([k,o])=>norm(o.nazev).startsWith(q))?.[0];
    if(!kod) return {chyba:`obec „${obec}" nemá v datech žádné sledované místo`};
    vybranaObec=kod; setTab('kraj'); repaint();
    const o=D.podleObce.get(kod);
    return {obec:o.nazev,celkem:o.celkem,bezbarierovych:o.ano,castecne:o.castecne,
      neprístupnych:o.ne,bez_udaje:o.nevime};
  },
  hradec_vrstva({vrstva}){
    const v=HRADEC.find(([k,n])=>norm(n).includes(norm(vrstva)))||HRADEC.find(([k,n])=>norm(vrstva).includes(norm(n).split(' ')[0]));
    if(!v) return {chyba:`vrstvu „${vrstva}" neznám`};
    vrstvaHK=v[0]; setTab('hradec');
    const f=D.hk[v[0]].features;
    const hod=f.reduce((a,x)=>{const h=x.properties.HODNOCENI;if(h)a['hodnoceni_'+h]=(a['hodnoceni_'+h]||0)+1;return a;},{});
    return {vrstva:v[1],pocet:f.length,...hod};
  },
  diry_v_datech(){ setTab('diry');
    return {bez_udaje:D.souhrn.nevime,
      knihovny_bez_udaje:D.mista.filter(m=>m.klic==='knihovny'&&m.stav==='nevime').length,
      obci_bez_mista:D.obce.features.length-D.podleObce.size,
      sluch_jen_v_sade:'Divadla a filharmonie'};
  },
  poznamky_rozbor(){ setTab('ai'); rozborPoznamek();
    return {poznamek:rozbor.n,znaku:rozbor.znaky,rampa:rozbor.rampa,schod:rozbor.schod,
      vytah:rozbor.vytah,se_sirkou_v_cm:rozbor.sirky}; }
};
function zamer(q){
  const s=norm(q); let m;
  if(/díry|diry|chyb[ií]|nevím|nevim|bez údaje|bez udaje/.test(s)) return {name:'diry_v_datech',args:{}};
  if(/poznám|poznam|text|rozbor|ai/.test(s)) return {name:'poznamky_rozbor',args:{}};
  if((m=s.match(/(?:vrstv[ayu]|hradec\w*)\s+(.+)$/))) return {name:'hradec_vrstva',args:{vrstva:m[1]}};
  // čeština skloňuje („kolik knihoven" vs sada „Knihovny"), porovnáváme kmeny
  const kmen=w=>w.length>5?w.slice(0,w.length-2):w;
  for(const x of KRAJ){
    const k=kmen(norm(x.nazev).split(' ')[0]);
    if(k.length>3 && s.includes(k)) return {name:'sada',args:{sada:x.nazev}};
  }
  for(const [k,n] of HRADEC) if(s.includes(norm(n).split(' ')[0])&&/hradec|vozíč|vozic|nevidom|zastáv|zastav|přechod|prechod/.test(s))
    return {name:'hradec_vrstva',args:{vrstva:n}};
  if((m=s.match(/(?:obec|v obci|ve měst[ěe])\s+(.+)$/))) return {name:'obec',args:{obec:m[1]}};
  const kod=[...D.podleObce].find(([k,o])=>s.includes(norm(o.nazev)));
  if(kod) return {name:'obec',args:{obec:kod[1].nazev}};
  if(/kolik|celkem|souhrn|kraj/.test(s)) return {name:'souhrn_kraje',args:{}};
  return null;
}
function formuluj(n,r){
  if(r.chyba) return 'To se mi nepovedlo: '+r.chyba+'.';
  switch(n){
    case 'souhrn_kraje': return `V kraji sledujeme <b>${r.mist} kulturních míst</b> v ${r.sad} sadách.
      Bezbariérových je <b>${r.bezbarierovych}</b>, částečně ${r.castecne}, nepřístupných ${r.neprístupnych}
      a u <b>${r.bez_udaje} míst údaj chybí</b>.`;
    case 'sada': return `<b>${r.sada}</b>: ${r.celkem} míst — ${r.ano} bezbariérových,
      ${r.castecne} částečně, ${r.ne} nepřístupných, ${r.nevime} bez údaje.`;
    case 'obec': return `<b>${r.obec}</b>: ${r.celkem} sledovaných míst, z toho
      <b>${r.bezbarierovych} bezbariérových</b>, ${r.neprístupnych} nepřístupných${r.bez_udaje?`, ${r.bez_udaje} bez údaje`:''}.`;
    case 'hradec_vrstva': {
      const h=[1,2,3].map(i=>r['hodnoceni_'+i]?`${i}: ${r['hodnoceni_'+i]}`:null).filter(Boolean).join(' · ');
      return `Vrstva <b>${r.vrstva}</b> má ${r.pocet} prvků.${h?' Hodnocení — '+h+'.':''}`;
    }
    case 'diry_v_datech': return `U <b>${r.bez_udaje} míst chybí údaj</b> o bezbariérovosti,
      z toho ${r.knihovny_bez_udaje} knihoven. ${r.obci_bez_mista} obcí ze 448 nemá ani jedno
      sledované místo. Sluchové postižení rozlišuje jediná sada: ${r.sluch_jen_v_sade}.`;
    case 'poznamky_rozbor': return `Rozebral jsem <b>${r.poznamek} poznámek</b> (${nf.format(r.znaku)} znaků).
      Rampu zmiňuje ${r.rampa}, schod ${r.schod}, výtah ${r.vytah};
      <b>${r.se_sirkou_v_cm}</b> uvádí konkrétní šířku v centimetrech.`;
  }
  return JSON.stringify(r);
}
function say(k,h){const d=document.createElement('div');d.className='msg '+k;d.innerHTML=h;
  $('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;}
function zeptej(q){
  if(!q.trim()) return;
  say('u','<b>Ty:</b> '+q);
  const z=zamer(q);
  if(!z) return say('a','Tomu nerozumím. Zkus „kolik knihoven je bezbariérových" nebo „díry v datech".');
  const r=FUNKCE[z.name](z.args);
  say('a',`<span class="tool">${z.name}(${Object.values(z.args).join(', ')})</span><br>`+formuluj(z.name,r));
}
const PRIKLADY=['Kolik knihoven je bezbariérových?','Díry v datech','Objekty pro vozíčky v Hradci',
  'Rozbor poznámek','Souhrn kraje'];
function renderChips(){
  $('chips').innerHTML=PRIKLADY.map(p=>`<button>${p}</button>`).join('');
  [...$('chips').children].forEach(b=>b.onclick=()=>{$('q').value=b.textContent;zeptej(b.textContent);});
}
$('send').onclick=()=>{zeptej($('q').value);$('q').value='';};
$('q').onkeydown=e=>{if(e.key==='Enter'){zeptej($('q').value);$('q').value='';}};
$('mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return say('a','Hlasový vstup tenhle prohlížeč neumí.');
  const r=new SR();r.lang='cs-CZ';r.onresult=e=>{const t=e.results[0][0].transcript;$('q').value=t;zeptej(t);};
  r.start();say('a','<i>Poslouchám…</i>');
};
</script>
