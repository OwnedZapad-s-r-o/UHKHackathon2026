# Nginx na Raspberry Pi — veřejná doména SmartAuditu.
# __DOMAIN__ nahradí setup-rpi.sh (nebo ručně: sed -i 's/__DOMAIN__/smartaudit.nasedomena.cz/g').
#
# Varianta A: vše jde reverzním SSH tunelem na notebook (127.0.0.1:3000 web, 127.0.0.1:8080 API).
# Varianta B: když tunel neodpovídá (notebook spí / bez Wi-Fi), nginx do 3 s přepne na statický mirror
#             otevřených dat a veřejných karet (opendata-mirror.py na 127.0.0.1:8090).

# Connection: upgrade jen u WebSocketů, jinak keep-alive
map $http_upgrade $smartaudit_connection {
    default upgrade;
    ''      '';
}

upstream smartaudit_web {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=10s;
}

upstream smartaudit_api {
    server 127.0.0.1:8080 max_fails=1 fail_timeout=10s;
}

upstream smartaudit_mirror {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Ověření Let's Encrypt (certbot --webroot) a přesměrování na HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Zápis kompatibilní s nginx 1.22 (Raspberry Pi OS Bookworm)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    client_max_body_size 10m;

    # Společné hlavičky — Next.js (Server Actions) i API (IRI v katalogu DCAT-AP-CZ) potřebují veřejnou doménu a https
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $smartaudit_connection;

    # Tunel musí odpovědět rychle — jinak raději mirror než čekající prohlížeč
    proxy_connect_timeout 3s;
    proxy_read_timeout    60s;

    # Otevřené API (Čl. 5.2b) — přímo na ASP.NET API, při výpadku ze statického mirroru
    location /api/open/v1/ {
        proxy_pass http://smartaudit_api;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mirror;
        add_header X-SmartAudit-Source "live" always;
    }

    # Vše ostatní (mapa, inspekční panel, QR karty, /api/* přes Next.js proxy)
    location / {
        proxy_pass http://smartaudit_web;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mirror;
    }

    location @mirror {
        proxy_pass http://smartaudit_mirror;
        add_header X-SmartAudit-Source "mirror" always;
    }

    # Zdraví mirroru (bez tunelu) — pro kontrolu před prezentací
    location = /mirror/health {
        proxy_pass http://smartaudit_mirror/health;
    }
}
