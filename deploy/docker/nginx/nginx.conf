# Nginx před SmartAuditem — jediný port ven (pro Cloudflare Tunnel), přístupové logy návštěvníků.
# Logy: stdout (docker compose logs -f nginx) a JSON soubor /var/log/nginx/access.json.log (složka logs/nginx u compose).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Skutečná IP návštěvníka: Cloudflare ji posílá v CF-Connecting-IP. Věříme jen spojením ze sítě Dockeru
    # a z tohoto počítače (cloudflared v kontejneru nebo na hostiteli) — z internetu hlavičku nikdo nepodvrhne.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    # Čitelný řádek: kdo, odkud (země z Cloudflare), co, s jakým výsledkem a jak rychle
    log_format visitors '$remote_addr [$time_local] $http_cf_ipcountry "$request" $status $body_bytes_sent '
                        '${request_time}s ref="$http_referer" ua="$http_user_agent"';

    # Strojově zpracovatelný záznam pro statistiky (who-is-visiting.ps1, jq, GoAccess)
    log_format visitors_json escape=json '{'
        '"time":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"country":"$http_cf_ipcountry",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"referer":"$http_referer",'
        '"userAgent":"$http_user_agent",'
        '"host":"$host",'
        '"ray":"$http_cf_ray"'
    '}';

    # Statické soubory Next.js a dotazy na stav do logu nepatří — jen by ho zahlcovaly
    map $request_uri $loggable {
        ~^/_next/       0;
        ~^/favicon      0;
        /nginx-health   0;
        default         1;
    }

    access_log /dev/stdout visitors if=$loggable;
    access_log /var/log/nginx/access.json.log visitors_json if=$loggable;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Za Cloudflare Tunnel přichází https v X-Forwarded-Proto, při přímém přístupu platí schéma spojení
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/geo+json application/ld+json text/csv image/svg+xml;
    gzip_min_length 1024;

    # DNS Dockeru — kontejner web/api po restartu dostane jinou IP, nginx si ji zjistí znovu
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        proxy_http_version 1.1;
        # $http_host zachová i port (http://localhost:8088) — IRI v katalogu a Server Actions pak sedí
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Otevřené API (DCAT-AP-CZ, JSON, GeoJSON, CSV) přímo na ASP.NET
        location /api/open/v1/ {
            set $api http://api:8080;
            proxy_pass $api;
        }

        # Web, mapa, QR karty a zbytek /api/* přes Next.js
        location / {
            set $web http://web:3000;
            proxy_pass $web;
        }
    }
}
