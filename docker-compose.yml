services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: smartaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartaudit}
      POSTGRES_DB: smartaudit
    # Databáze jen pro tento počítač (nástroje, migrace) — do sítě ji nevystavujeme
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartaudit -d smartaudit"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MQTT broker pro IQRF Gateway Daemon — gateway v síti se připojí na IP tohoto počítače, port 8883 (TLS, jméno a heslo).
  # Nešifrovaný port 1883 je jen pro backend v síti Dockeru a nástroje na tomto počítači (127.0.0.1).
  mqtt:
    build:
      context: ./mqtt
    environment:
      MQTT_BACKEND_USERNAME: smartaudit-backend
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-local-demo-mqtt-backend-password}
      MQTT_TLS_HOSTS: ${IQRF_BROKER_PUBLIC_HOST:-}
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_certs:/mosquitto/certs
    ports:
      - "${MQTT_PLAIN_BIND:-127.0.0.1}:1883:1883"
      - "8883:8883"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=smartaudit;Username=smartaudit;Password=${POSTGRES_PASSWORD:-smartaudit}"
      JwtSettings__Secret: ${JWT_SECRET:-change-me-please-this-is-only-a-local-demo-secret-0123456789}
      OpenDataSettings__SnapshotPath: /seed/opendata
      # IRI v katalogu DCAT-AP-CZ na veřejné doméně (jinak podle X-Forwarded-* hlaviček)
      OpenDataSettings__PublicBaseUrl: ${PUBLIC_URL:-}
      AzureOpenAiSettings__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAiSettings__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      AzureOpenAiSettings__Deployment: ${AZURE_OPENAI_DEPLOYMENT:-}
      AzureOpenAiSettings__EmbeddingDeployment: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      OpenAiSettings__ApiKey: ${OPENAI_API_KEY:-}
      OpenAiSettings__Model: ${OPENAI_MODEL:-gpt-4o}
      OpenAiSettings__EmbeddingModel: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      IqrfSettings__Host: mqtt
      IqrfSettings__Username: smartaudit-backend
      IqrfSettings__Password: ${MQTT_BACKEND_PASSWORD:-local-demo-mqtt-backend-password}
      IqrfSettings__DeviceSecret: ${MQTT_DEVICE_SECRET:-local-demo-mqtt-device-secret-0123456789}
      IqrfSettings__ProvisioningPassword: ${MQTT_PROVISIONING_PASSWORD:-local-demo-mqtt-provisioning-password}
      IqrfSettings__PublicHost: ${IQRF_BROKER_PUBLIC_HOST:-}
      IqrfSettings__CaCertificatePath: /mqtt-certs/ca.crt
    volumes:
      - ./seed:/seed
      # Jen ke čtení — aplikace nabídne správci ke stažení veřejný certifikát CA pro gateway
      - mqtt_certs:/mqtt-certs:ro
    # API jen pro tento počítač — z (veřejné) sítě se k němu jde přes web (Next.js přeposílá /api/*)
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
        # Veřejná doména (Raspberry Pi / tunel) — QR kódy na cedulkách pak nevedou na localhost
        NEXT_PUBLIC_PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "3000:3000"

  # Volitelný emulátor IQRF gatewaye (Python) bez nutnosti instalovat Python na počítač:
  # docker compose --profile emulator up
  # Gateway „ucebna-1“ musí být v aplikaci připojená (Senzory → Připojit), jinak ji broker nepustí.
  # Heslo gatewaye si emulátor odvodí ze stejného tajemství jako backend.
  emulator:
    image: python:3.12-slim
    profiles: ["emulator"]
    working_dir: /app
    volumes:
      - ./tools/iqrf-emulator:/app
    environment:
      MQTT_DEVICE_SECRET: ${MQTT_DEVICE_SECRET:-local-demo-mqtt-device-secret-0123456789}
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python emulator.py --host mqtt --gateway ucebna-1"
    depends_on:
      - mqtt

  # Testovací síť kraje v Pythonu: pět emulovaných gatewayí v pěti okresech (stejné jako tlačítko v aplikaci)
  # a zařízení k párování (nové gatewaye z výroby, čidla v dosahu) — nálepky s hesly vypíše: docker compose logs emulators
  # docker compose --profile emulators up -d
  # Gatewaye musí být v aplikaci připojené (Senzory → Spustit testovací síť kraje); virtuální gatewaye aplikace pak ustoupí.
  emulators:
    profiles: ["emulators"]
    build:
      context: ./tools/iqrf-emulator
    environment:
      MQTT_DEVICE_SECRET: ${MQTT_DEVICE_SECRET:-local-demo-mqtt-device-secret-0123456789}
      MQTT_PROVISIONING_PASSWORD: ${MQTT_PROVISIONING_PASSWORD:-local-demo-mqtt-provisioning-password}
      PYTHONUNBUFFERED: "1"
    command: ["python", "multi_emulator.py", "--host", "mqtt"]
    depends_on:
      - mqtt
      - api

volumes:
  db_data:
  mqtt_data:
  mqtt_certs:
