# MQTT broker pro IQRF Gateway Daemon.
# Bez anonymního přístupu: každá gateway má vlastní účet, který smí jen na své topicy gateway/{id}/iqrf/*.
# Účty a práva spravuje plugin Dynamic Security — zakládá je backend SmartAuditu (IqrfGatewayService).
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Nešifrovaný port jen pro vnitřní síť Dockeru (backend) a nástroje na tomto počítači —
# docker-compose ho vystavuje jen na 127.0.0.1
listener 1883 0.0.0.0

# Šifrovaný port pro gatewaye v budovách (TLS, přihlášení jménem a heslem gatewaye).
# Certifikáty vytvoří entrypoint.sh při prvním startu; minimální verze TLS 1.2 kvůli starším gatewayím, 1.3 se vyjedná sama.
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Vzájemné ověření certifikátem (mTLS) lze zapnout, až budou mít gatewaye vlastní klientské certifikáty
require_certificate false

# Zprávy s QoS 1 pro odpojený backend (trvalá relace) přežijí restart brokeru
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
