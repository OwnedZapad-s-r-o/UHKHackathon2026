# MQTT broker pro IQRF Gateway Daemon — jen pro lokální síť (hackathon, demo).
# Anonymní přístup bez TLS: do veřejné sítě broker nevystavujte, nebo doplňte password_file a TLS.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
